name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      # Build on every event so a broken markdown change fails CI
      # before merge.
      - name: Build Documentation
        run: mdbook build
        working-directory: website

      # Only deploy to Azure on a push to main. Skipping pull_request
      # events here means no per-PR preview environment is created.
      - name: Deploy
        id: deploy
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "website/book"
          skip_app_build: true
