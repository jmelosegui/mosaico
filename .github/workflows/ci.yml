name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main. A stacked branch
  # opens its pull request against the branch below it, and with a
  # branches filter here those got no checks at all.
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: windows-latest
    # The CLI tests drive a real daemon. Bound the job so a deadlock fails
    # in minutes instead of occupying a runner until the six hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Doc tests
        run: cargo test --doc

      - name: CLI tests
        run: cargo test -p mosaico --test cli

  desktop:
    name: Desktop tests
    # tests/window_management.rs drives a live daemon, launches notepad and
    # asserts on real DWM geometry, borders and cursor position. A hosted
    # runner has no interactive desktop to do that against, so it runs on
    # demand rather than on every pull request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Window management tests
        run: cargo test -p mosaico --test window_management
