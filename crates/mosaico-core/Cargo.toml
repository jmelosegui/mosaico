[package]
name = "mosaico-core"
version = "0.10.0"
edition = "2024"
description = "Platform-agnostic core types and traits for Mosaico"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
mosaico-metrics = { path = "../mosaico-metrics" }

[lints]
workspace = true
